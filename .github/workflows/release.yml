name: release-artifacts

# Builds, checksums, and smoke-tests archives. It never creates a tag. For a pushed tag it
# attaches the archives and install.sh to a DRAFT release; a human reviews the draft and clicks
# Publish (PRD final checkpoint). Users then install with scripts/install.sh.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sh scripts/package-release.sh ${{ matrix.target }}
      - run: sh scripts/smoke-release.sh dist/lgit-*-${{ matrix.target }}.tar.gz
      - run: sh scripts/smoke-install.sh dist/lgit-*-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: lgit-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: cp scripts/install.sh assets/install.sh
      - run: cd assets && sha256sum * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
